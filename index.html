<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mumbai Plan</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 520px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .gallery {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .gallery img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      transition: 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.15);
    }

    video {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
    }

    button {
      padding: 12px 24px;
      margin: 10px;
      border-radius: 999px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .yes {
      background: #22c55e;
      color: white;
    }

    .no {
      background: #ef4444;
      color: white;
      position: relative;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>We survived Mumbai once… 😌</h1>

  <div class="gallery">
    <img src="mumbai1.jpg">
    <img src="mumbai2.jpg">
    <img src="mumbai3.jpg">
  </div>

  <video autoplay muted loop>
    <source src="mumbai-video.mp4" type="video/mp4">
  </video>

  <p>Round 2 — are we doing coffee again? ☕</p>

  <button class="yes" onclick="yesClicked()">Obviously 😌</button>
  <button class="no" id="noBtn" onmouseover="moveButton()">No 😏</button>

</div>

<script>
function yesClicked() {
  document.body.innerHTML = `
    <div class="card">
      <h1>Good. Mumbai round 2 locked ☕😌</h1>
      <p>I’ll plan it. You just show up.</p>
    </div>
  `;
}

function moveButton() {
  let btn = document.getElementById("noBtn");
  let x = Math.random() * 200 - 100;
  let y = Math.random() * 100 - 50;
  btn.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>
