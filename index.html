<!DOCTYPE html>
<html>
<head>
  <title>Question for You</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 40px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .yes {
      background-color: #22c55e;
      color: white;
    }
    .no {
      background-color: #ef4444;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

<h1>Should we go for coffee when I’m in Mumbai? ☕</h1>

<button class="yes" onclick="yesClicked()">Yes 😌</button>
<button class="no" id="noBtn" onmouseover="moveButton()">No 😏</button>

<script>
function yesClicked() {
  document.body.innerHTML = "<h1>Good choice. I knew you had taste 😌</h1>";
}

function moveButton() {
  let btn = document.getElementById("noBtn");
  let x = Math.random() * window.innerWidth * 0.8;
  let y = Math.random() * window.innerHeight * 0.8;
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}
</script>

</body>
</html>
