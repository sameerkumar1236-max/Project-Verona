<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Important Question</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, rgba(236, 72, 153, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.3), transparent 35%),
        linear-gradient(135deg, #020617, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px 32px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      animation: floatIn 0.9s ease forwards;
      position: relative;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.18;
      letter-spacing: -0.8px;
    }

    p {
      margin: 16px 0 34px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 74px;
      position: relative;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      border-radius: 999px;
      padding: 15px 28px;
      transition: 0.25s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .yes {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }

    .yes:hover {
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 18px 40px rgba(34, 197, 94, 0.35);
    }

    .no {
      background: linear-gradient(135deg, #ef4444, #be123c);
      color: white;
      position: relative;
    }

    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: #94a3b8;
    }

    .result {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -0.7px;
    }

    .sub-result {
      margin-top: 18px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
    }

    .heart {
      position: fixed;
      font-size: 22px;
      animation: rise 1.8s ease-out forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes rise {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateY(-160px) scale(1.8);
      }
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 28px;
      }

      .card {
        padding: 34px 22px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <div class="badge">Important Mumbai Committee Meeting</div>

    <h1>Mumbai plan: coffee with you. Confirm?</h1>

    <p>
      This is a legally unserious question, but your answer will be taken very seriously.
    </p>

    <div class="buttons">
      <button class="yes" onclick="yesClicked()">Obviously 😌</button>
      <button class="no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😏</button>
    </div>

    <div class="hint">Choose carefully. The red button has trust issues.</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    let noCount = 0;

    const noTexts = [
      "No 😏",
      "Are you sure?",
      "Think again",
      "Wrong answer",
      "Try again",
      "Not allowed"
    ];

    function moveButton() {
      noCount++;

      const x = Math.random() * 260 - 130;
      const y = Math.random() * 160 - 80;

      noBtn.style.transform = `translate(${x}px, ${y}px) scale(${Math.max(0.75, 1 - noCount * 0.06)})`;
      noBtn.innerText = noTexts[Math.min(noCount, noTexts.length - 1)];
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div class="card">
          <div class="badge">Confirmed</div>
          <div class="result">
            Good choice.<br>
            I knew you had taste 😌☕
          </div>
          <div class="sub-result">
            Mumbai coffee plan is now officially locked.<br>
            I will pick the place. You just show up cute.
          </div>
        </div>
      `;

      for (let i = 0; i < 28; i++) {
        setTimeout(createHeart, i * 80);
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = ["💙", "☕", "✨", "😌"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "20px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 1800);
    }
  </script>

</body>
</html>
