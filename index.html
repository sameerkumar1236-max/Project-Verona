<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Crazy Amishaaa</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#ffd6e8,#d7ecff);
  color:#24172f;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.card{
  width:100%;
  max-width:560px;
  background:rgba(255,255,255,.48);
  border-radius:30px;
  padding:26px;
  text-align:center;
  box-shadow:0 24px 70px rgba(93,61,118,.25);
  backdrop-filter:blur(18px);
}

h1{font-size:27px;margin:0 0 10px}
p{color:#4b3656;line-height:1.5}

.media{
  width:100%;
  height:330px;
  border-radius:24px;
  overflow:hidden;
  margin:20px 0;
  background:#eadcff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.media img,.media video{
  width:100%;
  height:100%;
  object-fit:contain;
}

button{
  border:none;
  border-radius:999px;
  padding:14px 24px;
  font-weight:900;
  cursor:pointer;
  margin:8px;
}

.yes{
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  color:white;
}

.no{
  background:linear-gradient(135deg,#f59e0b,#fb7185);
  color:white;
  position:relative;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(0,0,0,.2);
  margin:4px;
}
.dot.active{background:#7c3aed}

.final{
  font-size:30px;
  font-weight:900;
  line-height:1.3;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Previously in Mumbai...</h1>
  <p>Tap once to start the chaos 🎬</p>
  <button class="yes" onclick="start()">Start</button>
</div>

<audio id="music" src="music.mp3" loop></audio>

<script>
const questions=[
{
title:"The Toto Evidence Review.",
text:"Remember when that girl took our photos and we thought they’d be iconic... but they came out like government CCTV footage? 😭",
media:'<img src="toto.jpeg">',
yes:"Still iconic 😂",
no:"Delete evidence"
},
{
title:"Mirror Check.",
text:"Okay but this one was accidentally cute. I will not be taking arguments.",
media:'<img src="mumbai2.jpeg">',
yes:"Fine, cute 😌",
no:"No comment"
},
{
title:"Mumbai Chaos Report.",
text:"Was Mumbai better because we were roaming around like absolute idiots?",
media:'<img src="mumbai3.jpeg">',
yes:"100% facts",
no:"Fake news"
},
{
title:"Final Scene.",
text:"Let’s bang Toto again — round 2, same chaos, better photos this time?",
media:'<video autoplay muted loop playsinline><source src="mumbai-video.mp4" type="video/mp4"></video>',
yes:"Let’s gooo 😌",
no:"No chance"
}
];

let current=0;
let noTexts=["No","Still no?","You sure?","Wrong answer","Lying now?","Try again"];
let noIndex=0;

function start(){
  const music=document.getElementById("music");
  music.volume=.45;
  music.play().catch(()=>{});
  render();
}

function render(){
  const q=questions[current];
  const dots=questions.map((_,i)=>`<span class="dot ${i===current?"active":""}"></span>`).join("");

  document.getElementById("card").innerHTML=`
    <div>${dots}</div>
    <h1>${q.title}</h1>
    <p>${q.text}</p>
    <div class="media">${q.media}</div>
    <button class="yes" onclick="yes()">${q.yes}</button>
    <button class="no" id="noBtn" onmouseenter="moveNo()" onclick="moveNo()">${q.no}</button>
  `;
}

function yes(){
  current++;
  noIndex=0;

  if(current<questions.length){
    render();
  }else{
    document.getElementById("card").innerHTML=`
      <div class="final">
        Correct answer.<br><br>
        Toto Round 2 officially approved 😌🛺
      </div>
      <p>Same chaos. Better photos. No random photographers this time.</p>
    `;
  }
}

function moveNo(){
  const btn=document.getElementById("noBtn");
  noIndex=Math.min(noIndex+1,noTexts.length-1);
  btn.innerText=noTexts[noIndex];

  const x=Math.random()*100-50;
  const y=Math.random()*60-30;
  btn.style.transform=`translate(${x}px,${y}px)`;
}
</script>

</body>
</html>
