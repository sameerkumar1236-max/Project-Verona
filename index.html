<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Crazy Amishaaa</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card {
  width: 100%;
  max-width: 560px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  border-radius: 28px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  transition: all 0.4s ease;
}

.fade {
  opacity: 0;
  transform: translateY(20px);
}

.progress {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 15px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(0,0,0,0.2);
}

.dot.active {
  background: #111;
}

h1 {
  font-size: 26px;
  margin-bottom: 10px;
}

p {
  color: #333;
  margin-bottom: 18px;
}

.media {
  width: 100%;
  height: 300px;
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 20px;
  background: #eee;
}

.media img, .media video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  position: relative;
  min-height: 60px;
}

button {
  padding: 14px 24px;
  border-radius: 999px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.yes {
  background: #22c55e;
  color: white;
}

.no {
  background: #ef4444;
  color: white;
  position: relative;
}

.final {
  font-size: 28px;
  font-weight: bold;
}

.float {
  position: fixed;
  bottom: -10px;
  font-size: 22px;
  animation: rise 2s linear forwards;
}

@keyframes rise {
  to {
    transform: translateY(-120vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card" id="card"></div>

<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<script>
const questions = [
{
  title: "Okay listen carefully...",
  text: "This is a serious audit of Mumbai chaos.",
  media: '<img src="mumbai1.jpeg">',
  yes: "Continue",
  no: "Nope"
},
{
  title: "First memory check.",
  text: "Did we or did we not have stupid levels of fun?",
  media: '<img src="mumbai1.jpeg">',
  yes: "Obviously",
  no: "No"
},
{
  title: "Second, evidence review.",
  text: "That random girl in the toto said 'I’ll click great photos'... and gave us THIS 😭",
  media: '<img src="mumbai2.jpeg">',
  yes: "Still funny 😂",
  no: "Trauma"
},
{
  title: "Final decision.",
  text: "So... we doing toto part 2 or what?",
  media: '<video autoplay muted loop><source src="mumbai-video.mp4"></video>',
  yes: "Let’s go 😏",
  no: "No chance"
}
];

let current = 0;
let noTexts = ["No", "Still no?", "You sure?", "Liar.", "Okay wow."];
let noIndex = 0;

function playSound() {
  document.getElementById("clickSound").play();
}

function render() {
  const q = questions[current];

  const dots = questions.map((_, i) =>
    `<div class="dot ${i===current?"active":""}"></div>`
  ).join("");

  document.getElementById("card").classList.add("fade");

  setTimeout(() => {
    document.getElementById("card").innerHTML = `
      <div class="progress">${dots}</div>
      <h1>${q.title}</h1>
      <p>${q.text}</p>
      <div class="media">${q.media}</div>
      <div class="buttons">
        <button class="yes" onclick="yesClick()">${q.yes}</button>
        <button class="no" id="noBtn" 
          onmouseenter="moveNo()" 
          onclick="moveNo()">${noTexts[noIndex]}</button>
      </div>
    `;
    document.getElementById("card").classList.remove("fade");
  }, 250);
}

function yesClick() {
  playSound();
  if (current < questions.length - 1) {
    current++;
    render();
  } else {
    endScreen();
  }
}

function moveNo() {
  const btn = document.getElementById("noBtn");
  const x = Math.random()*200 - 100;
  const y = Math.random()*100 - 50;

  btn.style.transform = `translate(${x}px, ${y}px)`;

  noIndex = (noIndex + 1) % noTexts.length;
  btn.innerText = noTexts[noIndex];
}

function endScreen() {
  document.body.innerHTML = `
    <div class="card">
      <div class="final">
        Good. Correct answer.<br><br>
        Mumbai Round 2 approved.<br>
        Same chaos, same idiots.
      </div>
    </div>
  `;

  for(let i=0;i<25;i++){
    setTimeout(()=>{
      let f = document.createElement("div");
      f.className="float";
      f.innerText=["✨","😂","☕","🛺"][Math.floor(Math.random()*4)];
      f.style.left=Math.random()*100+"vw";
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),2000);
    },i*80);
  }
}

render();
</script>

</body>
</html>
