<!DOCTYPE html>
<html>
<head>
  <title>A Very Important Question</title>

  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 45px 35px;
      border-radius: 24px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 32px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      position: relative;
      min-height: 60px;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .yes {
      background: #22c55e;
      color: white;
    }

    .yes:hover {
      transform: scale(1.08);
      background: #16a34a;
    }

    .no {
      background: #ef4444;
      color: white;
      position: relative;
    }

    .result {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Mumbai plan: coffee with you. Confirm?</h1>
    <p>This is a legally unserious question.</p>

    <div class="buttons">
      <button class="yes" onclick="yesClicked()">Obviously 😌</button>
      <button class="no" id="noBtn" onmouseover="moveButton()">No 😏</button>
    </div>
  </div>

  <script>
    function yesClicked() {
      document.body.innerHTML = `
        <div class="card">
          <div class="result">
            Good choice.<br>I knew you had taste 😌☕
          </div>
        </div>
      `;
    }

    function moveButton() {
      const btn = document.getElementById("noBtn");
      const x = Math.random() * 220 - 110;
      const y = Math.random() * 120 - 60;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
